<header class="navbar">
    <style>
        .navbar {
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s ease;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .navbar nav {
            display: flex;
            gap: 1rem;
        }

        
        .navbar nav a,
        .navbar .theme-btn {
            position: relative;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary);
            background: transparent;
            border: 2px solid var(--primary);
            padding: 0.55rem 1.4rem;
            border-radius: 50px;
            transition: background 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            overflow: hidden;
        }

        .navbar nav a:hover,
        .navbar nav a.active {
            background: var(--primary);
            color: white;
        }

        .navbar .theme-btn:hover {
            background: var(--primary);
        }

        
        .navbar .theme-btn::before {
            content: "Light";
            font-size: 0.85rem;
            color: var(--primary);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="dark"] .navbar .theme-btn::before {
            content: "Dark";
        }

        

        .navbar .theme-btn {
            min-width: 85px;
            padding: 0.55rem 1rem;
        }

        
        [data-theme="dark"] .navbar nav a,
        [data-theme="dark"] .navbar .theme-btn {
            color: var(--primary);
            border-color: var(--primary);
        }

        [data-theme="dark"] .navbar nav a:hover,
        [data-theme="dark"] .navbar nav a.active,
        [data-theme="dark"] .navbar .theme-btn:hover {
            background: var(--primary);
            color: white;
        }

        [data-theme="dark"] .navbar .theme-btn:hover::before {
            color: white;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem 2rem;
            }
            .nav-right {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 1.5rem;
            }
        }
    </style>

    <div class="nav-container">
        <h1 class="logo">
            <a href="/">Earthquake Risk Intelligence</a>
        </h1>

        <div class="nav-right">
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Risk Prediction</a>
                <a href="/insights" class="{% if request.path == '/insights' %}active{% endif %}">Data Insights</a>
            </nav>

            <button id="theme-toggle" class="theme-btn"></button>
        </div>
    </div>
</header>
